name: Update README Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # GITHUB STATS
      # =========================

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=TiagoBorba013&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed&text_color=ffffff
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # TOP LANGUAGES
      # =========================

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=TiagoBorba013&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&text_color=ffffff
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # PROJECT CARDS
      # =========================

      - name: Generate Exercicio 1 Web Front End
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Exercicio-1-web-front-end&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-exercicio-1-web-front-end.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Atividade 2 Front End
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Atividade-2-fronte-end&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-atividade-2-fronte-end.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Atividade Semana 4
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Atividae-semna-4-front-end&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-atividade-semana-4.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Sprint 1 TI
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Sprint-1-TI&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-sprint-1-ti.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate My Bingo Mixer
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=my-bingo-mixer&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-my-bingo-mixer.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Trabalho Pratico DIW
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Trabalho-Pr-tico-DIW&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-trabalho-pratico-diw.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # ACTIVITY GRAPH
      # =========================

      - name: Generate Activity Graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: TiagoBorba013
          options: bg_color=050505&color=00e5ff&line=7c3aed&point=ffffff&area_color=050505&area=true&hide_border=true&custom_title=TIAGO%20SOUSA%20DE%20BORBA%20%E2%80%94%20ACTIVITY%20MATRIX
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # COMMIT ALL GENERATED FILES
      # =========================

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update README cards" || exit 0

          git push
