name: Update README Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=TiagoBorba013&show_icons=true&theme=tokyonight&include_all_commits=true&count_private=true&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed&text_color=ffffff
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=TiagoBorba013&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&text_color=ffffff
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Project 1
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Exercicio-1-web-front-end&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-1.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Project 2
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Atividade-2-fronte-end&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-2.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Project 3
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Atividae-semna-4-front-end&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-3.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Project 4
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Sprint-1-TI&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-4.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Project 5
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=my-bingo-mixer&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-5.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Project 6
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=TiagoBorba013&repo=Trabalho-Pr-tico-DIW&theme=tokyonight&hide_border=true&bg_color=050505&title_color=00e5ff&icon_color=7c3aed
          path: profile/project-6.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git commit -m "Update README cards" || exit 0

          git push
